[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `npm run dev` lance Netlify Dev : seul point d'entrée en local, http://localhost:8888.
# Vite tourne derrière sur 5173 (interne, inutile de l'ouvrir).
[dev]
  framework = "vite"
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false
